AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Sol sostenido - tabla de mensajes de apoyo (DynamoDB)

Parameters:
  Entorno:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Entorno de despliegue; forma parte del nombre de la tabla

Resources:
  # Modo provisioned y clase Standard: es lo que cubre el nivel gratuito (25 RCU y 25 WCU por región y cuenta).
  # Sin autoescalado: si llega mucho tráfico, las peticiones fallan en vez de generar cobros.
  TablaMensajes:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "sol-sostenido-mensajes-${Entorno}"
      BillingMode: PROVISIONED
      TableClass: STANDARD
      ProvisionedThroughput:
        ReadCapacityUnits: 15
        WriteCapacityUnits: 15
      # fecha: "2026-10-18" (los mensajes de un día se consultan juntos)
      # id: ULID (ordena por hora y evita que dos mensajes se pisen)
      # Los demás campos no se declaran aquí: universidad, texto, nombre (opcional) y estado (pendiente | aprobado)
      AttributeDefinitions:
        - AttributeName: fecha
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: fecha
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE

Outputs:
  NombreTabla:
    Description: Nombre de la tabla de mensajes
    Value: !Ref TablaMensajes
    Export:
      Name: !Sub "sol-sostenido-${Entorno}-tabla-mensajes"
  ArnTabla:
    Description: ARN de la tabla, para dar permisos a la Lambda
    Value: !GetAtt TablaMensajes.Arn
    Export:
      Name: !Sub "sol-sostenido-${Entorno}-tabla-mensajes-arn"
